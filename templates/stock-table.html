
<script type="text/x-template" id="tpl-stock">
    <div>
        <div class="section-top">
            <h2>Daftar Bahan Ajar</h2>
            <span class="muted">
                {{ jumlahData }} data ditemukan
            </span>
        </div>

        <div class="tablewrap">
            <table>
                <thead>
                    <tr>
                        <th>Kode / Mata Kuliah</th>
                        <th>Kategori</th>
                        <th>UT Daerah</th>
                        <th>Rak</th>
                        <th>Harga</th>
                        <th>Stok</th>
                        <th>Safety</th>
                        <th>Status</th>
                        <th>Catatan</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody>
                    <tr
                        v-for="item in items"
                        :key="item.id"
                    >
                        <td>
                            <strong>{{ item.kode }}</strong>
                            <small>{{ item.judul }}</small>
                        </td>

                        <td>{{ item.kategori }}</td>
                        <td>{{ item.upbjj }}</td>
                        <td>{{ item.lokasiRak }}</td>
                        <td>{{ item.harga | rupiah }}</td>
                        <td>{{ item.qty | satuan }}</td>
                        <td>{{ item.safety | satuan }}</td>

                        <td>
                            <status-badge
                                :qty="Number(item.qty)"
                                :safety="Number(item.safety)"
                            ></status-badge>
                        </td>

                        <td>
                            <div
                                class="catatan-wrapper"
                                @mouseenter="tampilkanCatatan(item)"
                                @mouseleave="sembunyikanCatatan"
                            >
                                <span class="catatan-trigger">
                                    Lihat Catatan
                                </span>

                                <div
                                    v-if="hoveredItem === item.id"
                                    class="catatan-tooltip"
                                    v-html="item.catatanHTML"
                                ></div>
                            </div>
                        </td>

                        <td>
                            <div class="actions">
                                <button
                                    type="button"
                                    class="btn secondary"
                                    @click="editItem(item)"
                                >
                                    Edit
                                </button>

                                <button
                                    type="button"
                                    class="btn danger"
                                    @click="hapusItem(item)"
                                >
                                    Hapus
                                </button>
                            </div>
                        </td>
                    </tr>

                    <tr v-if="items.length === 0">
                        <td colspan="10" class="empty">
                            Tidak ada bahan ajar yang sesuai dengan filter.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</script>
